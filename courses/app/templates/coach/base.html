<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Кабинет коуча{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: #f4f6f8; }
        .coach-navbar { background: #1f3d2b; }
        .coach-navbar .nav-link { color: #dce7d8; }
        .coach-navbar .nav-link:hover,
        .coach-navbar .nav-link.active { color: #fff; }
        .coach-navbar .navbar-brand { color: #fff; font-weight: 700; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg coach-navbar mb-0">
    <div class="container-fluid">
        <a class="navbar-brand" href="/{{ source_lang }}/{{ ui_lang }}/coach/">Кабинет коуча</a>
        <div class="navbar-nav">
            <a class="nav-link {% if current_page == 'coach' %}active{% endif %}"
               href="/{{ source_lang }}/{{ ui_lang }}/coach/">Уроки</a>
            <a class="nav-link" href="/{{ source_lang }}/{{ ui_lang }}/classroom/">Classroom</a>
        </div>
    </div>
</nav>
<main class="container-fluid py-4">
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
